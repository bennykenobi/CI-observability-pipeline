name: Manual Ingestion Test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Free-form marker so each test run is easy to identify"
        required: false
        default: "manual-smoke"

jobs:
  observability-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Echo context
        run: |
          echo "Scenario: ${{ inputs.scenario }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run attempt: ${{ github.run_attempt }}"

      - name: Simulate setup
        run: |
          echo "Preparing smoke test"
          sleep 2

      - name: Simulate workload
        run: |
          echo "Running workflow activity to generate step telemetry"
          sleep 3

      - name: Emit observability event
        continue-on-error: true
        env:
          CI_OBS_CALLBACK_URL: ${{ secrets.CI_OBS_CALLBACK_URL }}
          CI_OBS_CALLBACK_SECRET: ${{ secrets.CI_OBS_CALLBACK_SECRET }}
          CI_OBS_CALLBACK_AUTH_TOKEN: ${{ secrets.CI_OBS_CALLBACK_AUTH_TOKEN }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          if [ -z "$CI_OBS_CALLBACK_URL" ] || [ -z "$CI_OBS_CALLBACK_SECRET" ] || [ -z "$CI_OBS_CALLBACK_AUTH_TOKEN" ]; then
            echo "Callback secrets not configured, skipping callback step"
            exit 0
          fi

          python <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          payload = {
              "event_type": "workflow_run_completed",
              "action": "completed",
              "delivery_id": os.environ["DELIVERY_ID"],
              "repository_id": int("${{ github.repository_id }}"),
              "repository_full_name": "${{ github.repository }}",
              "run_id": int("${{ github.run_id }}"),
              "run_attempt": int("${{ github.run_attempt }}"),
              "sent_at": __import__("datetime").datetime.now(__import__("datetime").UTC).isoformat(),
          }
          body = json.dumps(payload).encode("utf-8")
          digest = hmac.new(
              os.environ["CI_OBS_CALLBACK_SECRET"].encode("utf-8"),
              body,
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["CI_OBS_CALLBACK_URL"].rstrip("/") + "/workflow/callback",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "X-Observability-Signature-256": f"sha256={digest}",
                  "X-Observability-Token": os.environ["CI_OBS_CALLBACK_AUTH_TOKEN"],
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(f"Callback status: {response.status}")
          PY

      - name: Emit summary
        run: |
          echo "Completed manual test workflow"

