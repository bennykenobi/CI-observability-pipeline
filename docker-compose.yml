services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ci_observability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    env_file:
      - .env
    environment:
      CI_OBS_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ci_observability
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      CI_OBS_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ci_observability
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:

