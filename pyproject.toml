[project]
name = "ci-observability-ingestion"
version = "0.1.0"
description = "Workflow-agnostic GitHub Actions observability ingestion platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "PyJWT>=2.10.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "services",
  "services.webhook_service",
  "services.ingestion_worker",
  "shared",
  "shared.db"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
